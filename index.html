<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MJSR Ski School Portal</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--navy:#1B2C4D;--gold:#B8922E;--gold-l:#f6efdf;--bg:#f5f6f8;--card:#fff;--line:#e2e5eb;--mut:#6b7385;--ok:#2e7d4f;--ok-l:#e3f3e8;--warn:#b26a00;--warn-l:#fff3dc;--bad:#b3261e;--bad-l:#fde7e5;--info-l:#e8eef8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:Arial,Helvetica,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
header{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:50}
.hbar{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:bold;font-size:16px;letter-spacing:.3px}
.brand small{display:block;font-weight:normal;font-size:11px;color:#c9cfdb;letter-spacing:1px;text-transform:uppercase}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px}
.rolechip{background:var(--gold);color:#fff;padding:3px 9px;border-radius:10px;font-weight:bold;text-transform:uppercase;font-size:11px}
nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;background:#22365c}
nav button{background:none;border:0;color:#c9cfdb;padding:10px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:var(--gold);font-weight:bold}
main{max-width:1280px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:16px}
.card h3{margin:14px 0 8px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:140px;flex:1}
.fld label{font-size:12px;color:var(--mut);font-weight:bold}
input,select,textarea{border:1px solid #cdd2db;border-radius:6px;padding:8px 9px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:bold;white-space:nowrap}
.btn.gold{background:var(--gold)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid #cdd2db}
.btn.red{background:var(--bad)}
.btn.green{background:var(--ok)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:12px}
.tile .k{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.5px}
.tile .v{font-size:24px;font-weight:bold;margin-top:4px}
.tile .s{font-size:12px;color:var(--mut)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--gold-l);font-size:12px;white-space:nowrap}
.tbl{overflow-x:auto}
.chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;white-space:nowrap}
.c-ok{background:var(--ok-l);color:var(--ok)}.c-warn{background:var(--warn-l);color:var(--warn)}.c-bad{background:var(--bad-l);color:var(--bad)}.c-info{background:var(--info-l);color:var(--navy)}.c-mut{background:#eceef2;color:var(--mut)}
.alert{padding:10px 12px;border-radius:6px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert.warn{background:var(--warn-l)}.alert.bad{background:var(--bad-l)}.alert.ok{background:var(--ok-l)}.alert.info{background:var(--info-l)}
.mut{color:var(--mut)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1px solid #cdd2db;border-radius:6px;padding:8px 10px;background:#fff;cursor:pointer;min-width:96px;text-align:center}
.slot b{display:block}
.slot.on{border-color:var(--gold);background:var(--gold-l);outline:2px solid var(--gold)}
.slot.full{opacity:.45;cursor:not-allowed}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid #cdd2db;border-radius:6px;padding:7px 11px;cursor:pointer;background:#fff;display:flex;gap:6px;align-items:center}
.seg input{width:auto}
.modal-bg{position:fixed;inset:0;background:rgba(27,44,77,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:10px;max-width:720px;width:100%;padding:18px;border-top:4px solid var(--gold)}
.modal h2{margin:0 0 12px;font-size:17px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;display:none;z-index:200;max-width:90%;border-left:4px solid var(--gold)}
#toast.err{background:var(--bad);border-left-color:#fff}
.login{max-width:380px;margin:60px auto}
.cal{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.calgrid{position:relative;min-width:900px}
.calhead{display:flex;position:sticky;top:0;background:var(--gold-l);font-size:11px;font-weight:bold;border-bottom:1px solid var(--line)}
.calrow{display:flex;border-bottom:1px solid var(--line);min-height:46px}
.calname{width:170px;flex:none;padding:6px 8px;font-size:12px;border-right:1px solid var(--line);background:#fafbfc}
.calname small{display:block;color:var(--mut);font-size:10px}
.caltrack{position:relative;flex:1}
.calhour{position:absolute;top:0;bottom:0;border-left:1px dashed #e8eaee}
.blk{position:absolute;top:4px;bottom:4px;border-radius:5px;background:var(--navy);color:#fff;font-size:11px;padding:3px 5px;overflow:hidden;cursor:pointer;border-left:4px solid var(--gold);line-height:1.25}
.blk.snb{background:#3a5a8c}
.blk.full{border-left-color:var(--bad)}
.off{position:absolute;inset:4px;background:repeating-linear-gradient(45deg,#f1f2f5,#f1f2f5 6px,#e6e8ec 6px,#e6e8ec 12px);border-radius:5px;font-size:11px;color:var(--mut);padding:6px}
.sig{border:1px dashed #9aa3b5;border-radius:6px;background:#fff;touch-action:none;width:100%;height:140px;display:block}
.scanbox{width:100%;max-width:420px;margin:0 auto}
.clauses{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#fafbfc;font-size:12px;line-height:1.45}
.clauses ol{margin:0;padding-left:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ticks td,.ticks th{text-align:center}
.hide{display:none!important}
#printArea{display:none}
.labels{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;padding:6mm}
.lbl{border:1px solid #999;border-radius:3mm;padding:2mm;display:flex;gap:2mm;align-items:center;page-break-inside:avoid;height:24mm}
.lbl .q{width:20mm;height:20mm;flex:none}
.lbl .q img,.lbl .q canvas{width:20mm!important;height:20mm!important}
.lbl .t{font-size:8pt;line-height:1.2;color:#000}
.lbl .t b{font-size:9pt;display:block}
.copy{max-width:560px;margin:0 auto;border:1px solid #999;padding:14px;font-size:12px}
@media print{
 body.printing header,body.printing main,body.printing .modal-bg,body.printing #toast{display:none!important}
 body.printing #printArea{display:block}
 @page{margin:8mm}
}
@media (max-width:640px){main{padding:10px}.card{padding:12px}.tile .v{font-size:20px}.calname{width:120px}}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand">MJSR Ski School<small>Samsons Digital</small></div>
    <div class="hright" id="hright"></div>
  </div>
  <nav id="nav" class="hide"></nav>
</header>
<main id="app"></main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbxMk8x48YFEaXKrtZrDvaQ-Hf2EgjyB5UP6PadGhGq2E0ATGRl1dI5FWhpk6zau6e6N4g/exec';
var BOOK_URL = 'https://samsons-digital.github.io/mjsr-ski-school/book.html';
var LEVELS = ['Beginner', 'Intermediate', 'Advanced'];
var CATS = { SKI: 'Skis', SNB: 'Snowboards', SKB: 'Ski boots', SBB: 'Snowboard boots', HLM: 'Helmets', JKT: 'Ski jackets', PNT: 'Ski pants', GOG: 'Goggles', GLV: 'Gloves', POL: 'Ski poles', SKT: 'Ice skates', TUB: 'Snow tubes', SNP: 'Snow play' };
var ACTIVE = { 'Confirmed': 1, 'Checked In': 1, 'Completed': 1 };
var CLAUSES = [
  'I accept for use as is the equipment listed on this form, and accept full responsibility for the care of the equipment while it is in my possession.',
  'I will be responsible for replacement at full retail value of any equipment rented under this agreement but not returned to MALAM JABBA SKI SHOP.',
  'I agree to hold harmless and indemnify MALAM JABBA SKI RESORT, and its owner, agents and employees as well as the manufacturers and distributors of this equipment, for any loss or damage, including any that results from claims for personal injury, death or property damage related to the use of this equipment.',
  'The equipment dealt with in this contract is to be used by the undersigned skier, snowboarder, snowblader or ice skater only, and I agree to reimburse and hold harmless MALAM JABBA SKI RESORT for any loss or damage when used by any other skier, snowboarder, snowblader or ice skater not specifically authorised on this form.',
  'I understand that there are inherent and other risks involved in the sport for which this equipment is to be used, that injuries are a common and ordinary occurrence of the sport, and I freely and voluntarily assume those risks.',
  'I hereby release MALAM JABBA SKI RESORT and its owner, directors, officers, volunteers, instructors, agents and employees from any and all liability for damage and injury or death to myself or to any person or property resulting from the selection, adjustment, installation, maintenance or use of the equipment, and for any claim based upon negligence, breach of warranty, contract or other legal theory, accepting myself the full responsibility for any and all such damages or injury which may result.',
  'I have made no misrepresentation to MALAM JABBA SKI RESORT regarding my height, weight, age or skier type.',
  'Skiers. I understand that the ski boot binding system will not release at all times or under all circumstances, nor is it possible to predict every situation in which it will release, and it is therefore no guarantee of my safety.',
  'Snowboarders. I am aware that snowboarding involves certain inherent risks, dangers and hazards. I am also aware that, unlike ski boot binding systems, snowboard boots and bindings ARE NOT DESIGNED OR INTENDED TO RELEASE, and they are therefore no guarantee of my safety.',
  'I hereby release and indemnify MALAM JABBA SKI RESORT and its owners, agents and employees from any and all liabilities for damage, injury or death to my undersigned child or to any person or property resulting from the selection, installation, adjustment, maintenance or use of this equipment, and for any claim based upon negligence, breach of warranty, contract, product defect or other legal theory.'
];

var S = { pin: '', user: '', role: '', tab: 'dash', date: '', boot: null };

/* ---------- utilities ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return 'Rs ' + Number(n || 0).toLocaleString('en-US'); }
function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, err ? 6000 : 3000); }
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
function mins(t) { var p = String(t).split(':'); return Number(p[0]) * 60 + Number(p[1] || 0); }
function addDays(d, n) { var p = d.split('-'); var x = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n, 12)); return x.toISOString().slice(0, 10); }
function pktNow() { var f = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Karachi', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date()); var o = {}; f.forEach(function (p) { o[p.type] = p.value; }); return { date: o.year + '-' + o.month + '-' + o.day, hm: (o.hour === '24' ? '00' : o.hour) + ':' + o.minute }; }
function dayName(d) { var p = d.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12)).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }); }
function can(roles) { return roles.indexOf(S.role) >= 0; }
function isYes(v) { return String(v).toUpperCase() === 'TRUE' || String(v).toUpperCase() === 'YES'; }

function api(action, data) {
  var body = Object.assign({ action: action, pin: S.pin, user: S.user }, data || {});
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Request failed'); return j; });
}
function busy(btn, on) { if (!btn) return; if (on) { btn._t = btn.textContent; btn.textContent = 'Working…'; btn.disabled = true; } else { btn.textContent = btn._t || btn.textContent; btn.disabled = false; } }

function openModal(html) { $('modal').innerHTML = html; $('modalBg').style.display = 'flex'; }
function closeModal() { stopScanner(); $('modalBg').style.display = 'none'; $('modal').innerHTML = ''; }
$('modalBg').addEventListener('click', function (e) { if (e.target === $('modalBg')) closeModal(); });

/* ---------- login ---------- */
function renderLogin(msg) {
  $('nav').classList.add('hide');
  $('hright').innerHTML = '';
  $('app').innerHTML = '<div class="card login"><h2>Staff login</h2>' +
    '<div class="fld"><label>Your name</label><input id="lgName" autocomplete="name" placeholder="Name for the activity log"></div><br>' +
    '<div class="fld"><label>PIN</label><input id="lgPin" type="password" inputmode="numeric" maxlength="6"></div><br>' +
    '<button class="btn gold" id="lgBtn" style="width:100%">Log in</button>' +
    (msg ? '<p class="alert bad" style="margin-top:12px">' + esc(msg) + '</p>' : '') +
    '<p class="mut" style="font-size:12px;margin-top:14px">Instructors use the <a href="instructor.html">Instructor page</a>. Guests book at the <a href="book.html">booking page</a>.</p></div>';
  $('lgName').value = ss('ssName') || '';
  $('lgPin').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  $('lgBtn').onclick = doLogin;
}
function doLogin() {
  var pin = $('lgPin').value.trim(), name = $('lgName').value.trim();
  if (!name) return toast('Enter your name', true);
  var b = $('lgBtn'); busy(b, true);
  S.pin = pin; S.user = name;
  api('login').then(function (j) {
    S.role = j.role; ss('ssPin', pin); ss('ssName', name); ss('ssRole', j.role);
    return load();
  }).catch(function (e) { busy(b, false); toast(e.message, true); });
}
function logout() { ss('ssPin', null); ss('ssRole', null); S.pin = ''; S.role = ''; S.boot = null; renderLogin(); }

/* ---------- boot ---------- */
function load(date) {
  S.date = date || S.date || pktNow().date;
  return api('bootstrap', { date: S.date }).then(function (j) {
    S.boot = j; S.role = j.role;
    renderShell(); render();
  }).catch(function (e) {
    if (/PIN|Session/.test(e.message)) { logout(); toast(e.message, true); } else { toast(e.message, true); }
  });
}
function refresh() { return load(S.date); }

var TABS = [
  { id: 'dash', name: 'Dashboard' }, { id: 'book', name: 'Bookings' }, { id: 'cal', name: 'Calendar' },
  { id: 'rent', name: 'Rentals' }, { id: 'ret', name: 'Returns' }, { id: 'recon', name: 'Reconciliation' },
  { id: 'eq', name: 'Equipment' }, { id: 'ins', name: 'Instructors' }, { id: 'set', name: 'Settings', roles: ['manager'] }
];
function renderShell() {
  var n = $('nav'); n.classList.remove('hide');
  n.innerHTML = TABS.filter(function (t) { return !t.roles || can(t.roles); }).map(function (t) { return '<button data-t="' + t.id + '" class="' + (S.tab === t.id ? 'on' : '') + '">' + t.name + '</button>'; }).join('');
  n.querySelectorAll('button').forEach(function (b) { b.onclick = function () { S.tab = b.dataset.t; stopScanner(); renderShell(); render(); }; });
  $('hright').innerHTML = '<span>' + esc(S.user) + '</span><span class="rolechip">' + esc(S.role) + '</span><button class="btn ghost sm" id="rfBtn">Refresh</button><button class="btn ghost sm" id="loBtn">Log out</button>';
  $('rfBtn').onclick = function () { refresh().then(function () { toast('Updated'); }); };
  $('loBtn').onclick = logout;
}
function render() {
  var f = { dash: renderDash, book: renderBookings, cal: renderCalendar, rent: renderRent, ret: renderReturns, recon: renderRecon, eq: renderEquipment, ins: renderInstructors, set: renderSettings }[S.tab];
  (f || renderDash)();
}

/* ---------- helpers on data ---------- */
function cat() { return S.boot.catalogue.slice().sort(function (a, b) { return Number(a.SortOrder) - Number(b.SortOrder); }); }
function prod(id) { return S.boot.catalogue.filter(function (p) { return p.ProductID === id; })[0]; }
function insById(id) { return S.boot.instructors.filter(function (i) { return i.InstructorID === id; })[0]; }
function bookingsOn(d) { return S.boot.bookings.filter(function (b) { return b.Date === d || b.Day2Date === d; }); }
function statusChip(s) { var c = { 'Confirmed': 'c-info', 'Checked In': 'c-ok', 'Completed': 'c-mut', 'No-show': 'c-bad', 'Cancelled': 'c-bad' }[s] || 'c-mut'; return '<span class="chip ' + c + '">' + esc(s) + '</span>'; }
function payChip(b) { return b.Payment === 'Paid' ? '<span class="chip c-ok">Paid</span>' : '<span class="chip c-warn">Unpaid</span>'; }
function graceFlag(b) {
  if (b.Channel !== 'Website' || b.Payment === 'Paid' || b.Status !== 'Confirmed' || !b.StartTime) return false;
  var n = pktNow(); var g = Number(S.boot.settings.NoShowGraceMins || 30);
  if (b.Date < n.date) return true;
  return b.Date === n.date && mins(n.hm) > mins(b.StartTime) + g;
}
function missingEmails() { return S.boot.instructors.filter(function (i) { return isYes(i.Active) && String(i.Email).indexOf('@') < 0; }); }

/* ============================== DASHBOARD ============================== */
function renderDash() {
  var b = S.boot, today = b.today;
  var todays = bookingsOn(today).filter(function (x) { return x.Status !== 'Cancelled'; });
  var lessons = todays.filter(function (x) { return x.InstructorID && ACTIVE[x.Status]; });
  var students = lessons.reduce(function (s, x) { return s + Number(x.Qty); }, 0);
  var insWorking = {}; lessons.forEach(function (x) { insWorking[x.InstructorID] = 1; });
  var paid = todays.filter(function (x) { return x.Payment === 'Paid' && x.Date === today; }).reduce(function (s, x) { return s + Number(x.AmountPaid || 0); }, 0);
  var unpaid = todays.filter(function (x) { return x.Payment !== 'Paid' && ACTIVE[x.Status] && x.Date === today; });
  var out = 0, dmg = 0, total = 0;
  Object.keys(b.equipmentSummary).forEach(function (k) { var s = b.equipmentSummary[k]; out += s.out; dmg += s.damaged; total += s.total; });
  var oldRentals = b.openRentals.filter(function (r) { return r.Date < today; });
  var flagged = b.bookings.filter(graceFlag);
  var miss = missingEmails();
  var yesterday = addDays(today, -1);
  var signedY = b.lastSignOff.some(function (r) { return r.Date === yesterday; });
  var webToday = b.bookings.filter(function (x) { return x.Channel === 'Website' && String(x.CreatedAt).slice(0, 10) === today; });

  var h = '<div class="tiles">' +
    tile('Lessons today', lessons.length, students + ' students') +
    tile('Instructors teaching', Object.keys(insWorking).length, 'of ' + b.instructors.filter(function (i) { return isYes(i.Active); }).length + ' active') +
    tile('Paid today', money(paid), 'Integrado receipts captured') +
    tile('Unpaid today', unpaid.length, money(unpaid.reduce(function (s, x) { return s + Number(x.Total); }, 0))) +
    tile('Items out now', out, b.openRentals.length + ' open rentals') +
    tile('Damaged stock', dmg, 'of ' + total + ' items') +
    tile('Web bookings today', webToday.length, 'created today') + '</div>';

  h += '<div class="card"><h2>Needs attention</h2>';
  var any = false;
  if (flagged.length) { any = true; h += '<div class="alert warn"><b>' + flagged.length + ' unpaid website booking(s)</b> past start time plus ' + esc(b.settings.NoShowGraceMins || 30) + ' minutes. Release the slot if the guest has not arrived. <button class="btn sm" onclick="S.tab=\'book\';S.bkFilter=\'flag\';renderShell();render()">Review</button></div>'; }
  if (oldRentals.length) { any = true; h += '<div class="alert bad"><b>' + oldRentals.length + ' rental(s) from earlier days still open.</b> Equipment has not been returned. <button class="btn sm" onclick="S.tab=\'recon\';renderShell();render()">Open reconciliation</button></div>'; }
  if (!signedY) { any = true; h += '<div class="alert warn">Reconciliation for <b>' + dayName(yesterday) + '</b> has not been signed off.</div>'; }
  if (miss.length) { any = true; h += '<div class="alert info"><b>Email to confirm</b> for ' + miss.length + ' instructor(s), so they will not receive booking emails: ' + miss.map(function (i) { return esc(i.Name); }).join(', ') + '</div>'; }
  var noTicks = b.instructors.filter(function (i) { return isYes(i.Active) && !['SkiBeginner', 'SkiIntermediate', 'SkiAdvanced', 'SnbBeginner', 'SnbIntermediate', 'SnbAdvanced'].some(function (k) { return isYes(i[k]); }); });
  if (noTicks.length) { any = true; h += '<div class="alert info"><b>No lessons ticked</b> for ' + noTicks.length + ' instructor(s), so they cannot be booked: ' + noTicks.map(function (i) { return esc(i.Name); }).join(', ') + '</div>'; }
  if (!b.settings.AlertEmails) { any = true; h += '<div class="alert info"><b>Alert emails to confirm.</b> Add the Ski School desk email in Settings so new web and phone bookings are emailed.</div>'; }
  if (!any) h += '<div class="alert ok">Nothing outstanding.</div>';

function renderBookings() {
  var d = S.date;

    '<div class="fld" style="max-width:180px"><label>Date</label><input type="date" id="bkDate" value="' + d + '"></div>' +

  $('app').innerHTML = h;
  $('bkFilter').value = S.bkFilter || 'all';
  $('bkDate').onchange = function () { S.date = this.value; ensureRange(S.date).then(drawBookingList); };
  $('bkFilter').onchange = function () { S.bkFilter = this.value; drawBookingList(); };
  $('bkSearch').oninput = drawBookingList;
  if ($('bkNew')) $('bkNew').onclick = function () { bookingForm(); };
  drawBookingList();
}
function ensureRange(d) {
  var have = S.boot.bookings.length ? true : false;
  var lo = S.boot._lo || addDays(S.boot.date, -7), hi = S.boot._hi || addDays(S.boot.date, 30);
  if (d >= lo && d <= hi) return Promise.resolve();
  var from = addDays(d, -7), to = addDays(d, 30);
  return api('bookingsRange', { from: from, to: to }).then(function (j) {
    var map = {}; S.boot.bookings.concat(j.bookings).forEach(function (b) { map[b.BookingID] = b; });
    S.boot.bookings = Object.keys(map).map(function (k) { return map[k]; });
    S.boot._lo = from < lo ? from : lo; S.boot._hi = to > hi ? to : hi;
  });
}
function drawBookingList() {
  var f = $('bkFilter').value, q = $('bkSearch').value.trim().toLowerCase(), d = S.date;
  var list = f === 'flag' ? S.boot.bookings.filter(graceFlag) : bookingsOn(d);
  list = list.filter(function (b) {
    if (f === 'lesson' && !b.InstructorID) return false;
    if (f === 'other' && b.InstructorID) return false;
    if (f === 'unpaid' && (b.Payment === 'Paid' || !ACTIVE[b.Status])) return false;
    if (f === 'cancel' && ACTIVE[b.Status]) return false;
    if ((f === 'all' || f === 'lesson' || f === 'other' || f === 'unpaid') && !ACTIVE[b.Status] && f !== 'all') return false;
    if (q && [b.CustomerName, b.Phone, b.BookingID, b.ReceiptNo].join(' ').toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function (a, b) { return (a.StartTime || '99') < (b.StartTime || '99') ? -1 : 1; });
  var h = '<h2>' + (f === 'flag' ? 'Unpaid website bookings past grace' : dayName(d)) + ' <span class="mut" style="font-weight:normal">(' + list.length + ')</span></h2>';
  if (!list.length) { $('bkList').innerHTML = h + '<p class="mut">No bookings.</p>'; return; }
  h += '<div class="tbl"><table><tr><th>Booking</th><th>Time</th><th>Product</th><th>Level</th><th>Qty</th><th>Instructor</th><th>Guest</th><th>Total</th><th>Status</th><th></th></tr>' +
    list.map(function (b) {
      return '<tr><td><b>' + esc(b.BookingID) + '</b><br><span class="mut" style="font-size:11px">' + esc(b.Channel) + '</span></td><td>' + (b.StartTime ? esc(b.StartTime + '–' + b.EndTime) : '<span class="mut">Any</span>') + (b.Day2Date ? '<br><span class="mut" style="font-size:11px">Day 2 ' + esc(b.Day2Date) + '</span>' : '') + '</td><td>' + esc(b.ProductName) + '</td><td>' + esc(b.Discipline ? b.Discipline + ' ' + b.Level : '') + '</td><td>' + esc(b.Qty) + '</td><td>' + esc(b.InstructorName) + '</td><td>' + esc(b.CustomerName) + '<br><span class="mut" style="font-size:11px">' + esc(b.Phone) + '</span></td><td>' + money(b.Total) + '</td><td>' + statusChip(b.Status) + '<br>' + payChip(b) + (graceFlag(b) ? '<br><span class="chip c-bad">Past grace</span>' : '') + '</td><td><button class="btn sm ghost" onclick="bookingDetail(\'' + b.BookingID + '\')">Open</button></td></tr>';
    }).join('') + '</table></div>';
  $('bkList').innerHTML = h;
}

/* signature pads */
var SIG = {};
function sigInit(id) {
  var c = $(id); if (!c) return;
  var ratio = window.devicePixelRatio || 1;
  var w = c.clientWidth || 400, h = c.clientHeight || 140;
  c.width = w * ratio; c.height = h * ratio;
  var ctx = c.getContext('2d'); ctx.scale(ratio, ratio); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1B2C4D';
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  var st = SIG[id] = { drawn: false, down: false };
  var pos = function (e) { var r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  c.onpointerdown = function (e) { st.down = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); c.setPointerCapture(e.pointerId); };
  c.onpointermove = function (e) { if (!st.down) return; var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); st.drawn = true; };
  c.onpointerup = c.onpointercancel = function () { st.down = false; };
}
function sigClear(id) { sigInit(id); }
function sigData(id) {
  var c = $(id), out = document.createElement('canvas');
  out.width = 600; out.height = Math.round(600 * c.height / c.width);
  var x = out.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height); x.drawImage(c, 0, 0, out.width, out.height);
  return out.toDataURL('image/jpeg', 0.7);
}

    '<div class="tbl"><table class="ticks"><tr><th style="text-align:left">Name</th><th>Type</th>' + TICKS.map(function (t) { return '<th>' + t[1] + '</th>'; }).join('') + '<th>Max</th><th>Scores</th><th style="text-align:left">Email</th>' + (mgr ? '<th>PIN</th><th></th>' : '') + '</tr>' +
    list.map(function (i) {
      return '<tr style="' + (isYes(i.Active) ? '' : 'opacity:.5') + '"><td style="text-align:left"><b>' + esc(i.Name) + '</b>' + (i.Role === 'Lead' ? ' <span class="chip c-info">Lead</span>' : '') + (isYes(i.Active) ? '' : ' <span class="chip c-mut">Inactive</span>') + '</td><td>' + esc(i.Type) + '</td>' + TICKS.map(function (t) { return '<td>' + (isYes(i[t[0]]) ? '<span style="color:var(--ok);font-weight:bold">✓</span>' : '<span class="mut">·</span>') + '</td>'; }).join('') + '<td>' + esc(i.MaxStudents) + '</td><td style="font-size:11px">' + esc((i.SkiScore ? 'Ski ' + i.SkiScore : '') + (i.SnbScore ? ' SNB ' + i.SnbScore : '')) + '</td><td style="text-align:left">' + (String(i.Email).indexOf('@') > 0 ? esc(i.Email) : '<span class="chip c-warn">Email to confirm</span>') + '</td>' + (mgr ? '<td>' + esc(i.PIN) + '</td><td><button class="btn sm ghost" onclick="insForm(\'' + i.InstructorID + '\')">Edit</button></td>' : '') + '</tr>';
    }).join('') + '</table></div></div>';
  if (mgr) h += '<div class="card"><h2>Instructor page</h2><p>Each instructor logs in to <b>instructor.html</b> with their own PIN to see their lessons. Share the PIN with the instructor only.</p></div>';
  $('app').innerHTML = h;
}
function insForm(id) {
  var i = id ? insById(id) : { Type: 'Seasonal', Role: 'Instructor', MaxStudents: 10, Active: 'TRUE' };
  var h = '<h2>' + (id ? 'Edit ' + esc(i.Name) : 'Add instructor') + '</h2><div class="grid2">' +
    '<div class="fld"><label>Name</label><input id="ifName" value="' + esc(i.Name) + '"></div><div class="fld"><label>Email</label><input id="ifEmail" type="email" value="' + esc(i.Email) + '"></div><div class="fld"><label>Phone</label><input id="ifPhone" value="' + esc(i.Phone) + '"></div>' +
    '<div class="fld"><label>Type</label><select id="ifType">' + ['Permanent', 'Seasonal', 'Intern'].map(function (t) { return '<option' + (t === i.Type ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>' +
    '<div class="fld"><label>Role</label><select id="ifRole"><option value="Instructor">Instructor</option><option value="Lead"' + (i.Role === 'Lead' ? ' selected' : '') + '>Ski School lead</option></select></div>' +
    '<div class="fld"><label>Max students per lesson</label><input id="ifMax" type="number" min="1" max="20" value="' + esc(i.MaxStudents || 10) + '"></div>' +
    '<div class="fld"><label>Ski course score</label><input id="ifSkiS" value="' + esc(i.SkiScore) + '"></div><div class="fld"><label>Snowboard course score</label><input id="ifSnbS" value="' + esc(i.SnbScore) + '"></div>' +
    '<div class="fld"><label>Instructor PIN (4 digits)</label><input id="ifPin" value="' + esc(i.PIN || '') + '" placeholder="Created automatically"></div>' +
    '<div class="fld"><label>Status</label><select id="ifActive"><option value="TRUE">Active</option><option value="FALSE"' + (i.Active === 'FALSE' ? ' selected' : '') + '>Inactive</option></select></div></div>' +
    '<h3>Lessons this instructor can be booked for</h3><table class="ticks"><tr><th></th>' + LEVELS.map(function (l) { return '<th>' + l + '</th>'; }).join('') + '</tr>' +
    [['Ski', 'Ski'], ['Snb', 'Snowboard']].map(function (d) { return '<tr><td><b>' + d[1] + '</b></td>' + LEVELS.map(function (l) { return '<td><input type="checkbox" style="width:auto;transform:scale(1.3)" id="tk' + d[0] + l + '"' + (isYes(i[d[0] + l]) ? ' checked' : '') + '></td>'; }).join('') + '</tr>'; }).join('') + '</table>' +
    '<div class="fld" style="margin-top:10px"><label>Notes</label><input id="ifNotes" value="' + esc(i.Notes) + '"></div>' +
    '<div class="foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn gold" id="ifSave">Save</button></div>';
  openModal(h);
  $('ifSave').onclick = function () {
    var p = { InstructorID: id || '', Name: $('ifName').value, Email: $('ifEmail').value, Phone: $('ifPhone').value, Type: $('ifType').value, Role: $('ifRole').value, MaxStudents: $('ifMax').value, SkiScore: $('ifSkiS').value, SnbScore: $('ifSnbS').value, PIN: $('ifPin').value, Active: $('ifActive').value, Notes: $('ifNotes').value };
    ['Ski', 'Snb'].forEach(function (d) { LEVELS.forEach(function (l) { p[d + l] = $('tk' + d + l).checked; }); });
    var btn = this; busy(btn, true);
    api('saveInstructor', { instructor: p }).then(function (j) { S.boot.instructors = j.instructors; closeModal(); renderInstructors(); toast('Saved'); }).catch(function (e) { busy(btn, false); toast(e.message, true); });
  };
}

/* ============================== SETTINGS ============================== */
function renderSettings() {
  var st = S.boot.settings;
  var h = '<div class="card"><h2>Operations</h2><div class="grid2">' +
    '<div class="fld"><label>Night skiing</label><select id="stNight"><option value="No">Off</option><option value="Yes"' + (isYes(st.NightSkiing) ? ' selected' : '') + '>On (opens night start times)</option></select></div>' +
    '<div class="fld"><label>Meeting point (shown to instructors)</label><input id="stMeet" value="' + esc(st.MeetingPoint) + '"></div>' +
    '<div class="fld"><label>Alert emails for web and phone bookings (comma separated)</label><input id="stAlert" value="' + esc(st.AlertEmails) + '"></div>' +
    '<div class="fld"><label>Grace minutes before unpaid web bookings are flagged</label><input id="stGrace" type="number" value="' + esc(st.NoShowGraceMins) + '"></div>' +
    '<div class="fld"><label>Web bookings open up to (days ahead)</label><input id="stDays" type="number" value="' + esc(st.WebMaxDaysAhead) + '"></div>' +
    '<div class="fld"><label>Public page notice</label><input id="stNotice" value="' + esc(st.WebNotice) + '"></div></div>' +
    '<div class="foot"><button class="btn gold" id="stSave">Save operations</button></div></div>' +
    '<div class="card"><h2>Staff PINs</h2><p class="mut" style="font-size:12px">Manager PIN stays 1234 as on the other portals. Leave a box blank to keep the current PIN.</p><div class="grid2">' + fld('pinDesk', 'Desk PIN (new)') + fld('pinLead', 'Lead PIN (new)') + fld('pinAudit', 'Audit PIN (new)') + '</div><div class="foot"><button class="btn" id="pinSave">Change PINs</button></div></div>' +
    '<div class="card"><div class="row"><h2 style="margin:0;flex:1">Catalogue and prices</h2><button class="btn gold" onclick="prodForm()">Add product</button></div><p class="mut" style="font-size:12px">Prices and times here drive the desk, the website page and the calendar. Changes apply to new bookings only.</p><div class="tbl"><table><tr><th>ID</th><th>Type</th><th>Product</th><th>Times</th><th>Mins</th><th>Price</th><th>Cap</th><th>Web</th><th>Active</th><th></th></tr>' +
    cat().map(function (p) { return '<tr><td>' + esc(p.ProductID) + '</td><td>' + esc(p.Category) + '</td><td><b>' + esc(p.Name) + '</b> ' + esc(p.Option) + '</td><td style="font-size:12px">' + esc(p.StartTimes || p.TimesLabel) + (p.NightStartTimes ? '<br><span class="mut">Night ' + esc(p.NightStartTimes) + '</span>' : '') + '</td><td>' + esc(p.DurationMins) + '</td><td>' + money(p.Price) + '</td><td>' + esc(isYes(p.NeedsInstructor) ? p.Capacity : '') + '</td><td>' + (isYes(p.WebBookable) ? '✓' : '') + '</td><td>' + (isYes(p.Active) ? '✓' : '<span class="chip c-mut">Off</span>') + '</td><td><button class="btn sm ghost" onclick="prodForm(\'' + p.ProductID + '\')">Edit</button></td></tr>'; }).join('') + '</table></div></div>' +
    '<div class="card"><h2>Links</h2><p>Public booking page, <a href="' + BOOK_URL + '" target="_blank" rel="noopener">' + BOOK_URL + '</a></p><p>Instructor page, <a href="instructor.html" target="_blank" rel="noopener">instructor.html</a></p></div>';
  $('app').innerHTML = h;
  $('stSave').onclick = function () {
    var btn = this; busy(btn, true);
    var pairs = [['NightSkiing', $('stNight').value], ['MeetingPoint', $('stMeet').value], ['AlertEmails', $('stAlert').value], ['NoShowGraceMins', $('stGrace').value], ['WebMaxDaysAhead', $('stDays').value], ['WebNotice', $('stNotice').value]];
    pairs.reduce(function (p, kv) { return p.then(function () { return api('saveSetting', { key: kv[0], value: kv[1] }); }); }, Promise.resolve())
      .then(function () { busy(btn, false); toast('Saved'); refresh(); }).catch(function (e) { busy(btn, false); toast(e.message, true); });
  };
  $('pinSave').onclick = function () {
    var pairs = [['PIN_DESK', $('pinDesk').value.trim()], ['PIN_LEAD', $('pinLead').value.trim()], ['PIN_AUDIT', $('pinAudit').value.trim()]].filter(function (x) { return x[1]; });
    if (!pairs.length) return toast('Nothing to change', true);
    var btn = this; busy(btn, true);
    pairs.reduce(function (p, kv) { return p.then(function () { return api('saveSetting', { key: kv[0], value: kv[1] }); }); }, Promise.resolve())
      .then(function () { busy(btn, false); toast('PINs changed'); renderSettings(); }).catch(function (e) { busy(btn, false); toast(e.message, true); });
  };
}
function prodForm(id) {
  var p = id ? prod(id) : { Category: 'Lesson', Active: 'TRUE', WebBookable: 'TRUE', Days: 1, Capacity: 10, NeedsInstructor: 'TRUE' };
  var h = '<h2>' + (id ? 'Edit ' + esc(p.Name) : 'Add product') + '</h2><div class="grid2">' +
    '<div class="fld"><label>Product ID</label><input id="pfId" value="' + esc(p.ProductID || '') + '"' + (id ? ' disabled' : '') + ' placeholder="For example L-3H"></div>' +
    '<div class="fld"><label>Type</label><select id="pfCat">' + ['Lesson', 'Rental', 'Clothing', 'Snow Activity'].map(function (c) { return '<option' + (c === p.Category ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></div>' +
    '<div class="fld"><label>Name</label><input id="pfName" value="' + esc(p.Name) + '"></div><div class="fld"><label>Option</label><input id="pfOpt" value="' + esc(p.Option) + '"></div>' +
    '<div class="fld"><label>Price (Rs)</label><input id="pfPrice" type="number" value="' + esc(p.Price) + '"></div><div class="fld"><label>Duration (minutes)</label><input id="pfDur" type="number" value="' + esc(p.DurationMins) + '"></div>' +
    '<div class="fld"><label>Start times (comma separated, 24h)</label><input id="pfStarts" value="' + esc(p.StartTimes) + '"></div><div class="fld"><label>Night start times</label><input id="pfNight" value="' + esc(p.NightStartTimes) + '"></div>' +
    '<div class="fld"><label>Times shown to guests</label><input id="pfTimes" value="' + esc(p.TimesLabel) + '"></div><div class="fld"><label>Includes</label><input id="pfInc" value="' + esc(p.Includes) + '"></div>' +
    '<div class="fld"><label>Days (2 for the 2-day lesson)</label><input id="pfDays" type="number" min="1" max="2" value="' + esc(p.Days || 1) + '"></div><div class="fld"><label>Max students per instructor</label><input id="pfCap" type="number" value="' + esc(p.Capacity) + '"></div>' +
    '<div class="fld"><label>Sort order</label><input id="pfSort" type="number" value="' + esc(p.SortOrder) + '"></div></div>' +
    '<div class="row" style="margin-top:10px">' + [['pfIns', 'Needs an instructor', p.NeedsInstructor], ['pfWeb', 'Bookable on website', p.WebBookable], ['pfAct', 'Active', p.Active]].map(function (x) { return '<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" id="' + x[0] + '"' + (isYes(x[2]) ? ' checked' : '') + '> ' + x[1] + '</label>'; }).join('') + '</div>' +
    '<div class="foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn gold" id="pfSave">Save</button></div>';
  openModal(h);
  $('pfSave').onclick = function () {
    var d = { ProductID: (id || $('pfId').value).trim().toUpperCase(), Category: $('pfCat').value, Name: $('pfName').value, Option: $('pfOpt').value, Price: $('pfPrice').value, DurationMins: $('pfDur').value, StartTimes: $('pfStarts').value.replace(/\s/g, ''), NightStartTimes: $('pfNight').value.replace(/\s/g, ''), TimesLabel: $('pfTimes').value, Includes: $('pfInc').value, Days: $('pfDays').value, Capacity: $('pfCap').value, SortOrder: $('pfSort').value, NeedsInstructor: $('pfIns').checked, WebBookable: $('pfWeb').checked, Active: $('pfAct').checked };
    var btn = this; busy(btn, true);
    api('saveProduct', { product: d }).then(function (j) { S.boot.catalogue = j.catalogue; closeModal(); renderSettings(); toast('Saved'); }).catch(function (e) { busy(btn, false); toast(e.message, true); });
  };
}

/* ---------- start ---------- */
(function init() {
  var pin = ss('ssPin'), name = ss('ssName');
  if (pin && name) { S.pin = pin; S.user = name; S.role = ss('ssRole') || ''; $('app').innerHTML = '<div class="card mut">Loading…</div>'; load(); }
  else renderLogin();
})();
</script>
</body>
</html>
